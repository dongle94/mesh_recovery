# Environments
ENV:
  DEVICE: cuda     # cuda, cpu
  GPU_NUM: 0

# Media
MEDIA:
  SOURCE: data/videos/sample_video.mp4  # /home/dongle94/Videos/IMG_1511.MOV
  OPT_AUTO: True
  FOURCC: "MJPG"
  WIDTH: 1280
  HEIGHT: 720
  FPS: 30
  REALTIME: False
  BGR: True
  ENABLE_PARAM: False
  CV_PARAM:
    - cv2.CAP_PROP_AUTO_EXPOSURE: 1
    - cv2.CAP_PROP_BRIGHTNESS: 128
    - cv2.CAP_PROP_EXPOSURE: 50

# Object Detector
DET:
  MODEL_TYPE: yolov11
  DET_MODEL_PATH: './weights/yolov11/yolo11m.pt'
  HALF: False
  CONF_THRES: 0.5
  OBJ_CLASSES: [0]
  YOLO:
    IMG_SIZE: 640
    NMS_IOU: 0.45
    AGNOSTIC_NMS: True
    MAX_DET: 20

# SPIN
SPIN:
  DEVICE: 'cuda'  # 'cuda' or 'cpu'
  SMPL_MEAN_PARAMS: './weights/spin/data/smpl_mean_params.npz'
  CHECKPOINT: './weights/spin/hmr.pt'
  SMPL_MODEL_DIR: './weights/smpl/basicModel_neutral_lbs_10_207_0_v1.0.0.pkl'
  JOINT_REGRESSOR_EXTRA: './weights/spin/data/J_regressor_extra.npy'

# VIBE
VIBE:
  DEVICE: 'cuda'  # 'cuda' or 'cpu'
  DATA_DIR: './weights/vibe/'
  USE_3DPW: False
  SEQLEN: 16
  BATCH_SIZE: 64
  N_LAYERS: 2
  HIDDEN_SIZE: 1024
  ADD_LINEAR: True
  USE_RESIDUAL: True

# HYBRIK
HYBRIK:
  CKPT: './weights/hybrik/hybrikx_rle_hrnet.pth'
  X: True
  SAVE_IMG: False
  SAVE_ORIG_IMG: False
  SAVE_MESH_IMG: False
  SAVE_VID: False
  SAVE_MESH_VID: False
  DRAW_HEATMAP: False

# Logger
LOG:
  LOG_LEVEL: 'debug'
  LOGGER_NAME: "MESH"
  CONSOLE_LOG: True
  CONSOLE_LOG_INTERVAL: 30
  FILE_LOG: False
  FILE_LOG_DIR: './log/'
  FILE_LOG_COUNTER: 10
  FILE_LOG_ROTATE_TIME: "D"
  FILE_LOG_ROTATE_INTERVAL: 1
